apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenticka-platforma.fullname" . }}
  labels:
    {{- include "agenticka-platforma.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agenticka-platforma.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agenticka-platforma.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/source: {{ .Files.Get "index.html" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: source
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: {{ include "agenticka-platforma.fullname" . }}-source
